# K8S-063 / 08 health criteria: StatefulSet states.
cases:
- name: healthy rolling update
  rev: 1
  now: "2026-01-01T00:05:00Z"
  since: "2026-01-01T00:00:00Z"
  plan: [{kind: StatefulSet, metadata: {name: db}}]
  cached:
  - {kind: StatefulSet, metadata: {name: db, generation: 2, labels: {control-8/revision: "1"}}, spec: {replicas: 2}, status: {observedGeneration: 2, readyReplicas: 2, updatedReplicas: 2, currentRevision: db-b, updateRevision: db-b}}
  want: {healthy: true}
- name: revisions differ
  rev: 1
  now: "2026-01-01T00:05:00Z"
  since: "2026-01-01T00:00:00Z"
  plan: [{kind: StatefulSet, metadata: {name: db}}]
  cached:
  - {kind: StatefulSet, metadata: {name: db, generation: 2, labels: {control-8/revision: "1"}}, spec: {replicas: 2}, status: {observedGeneration: 2, readyReplicas: 2, updatedReplicas: 2, currentRevision: db-a, updateRevision: db-b}}
  want: {healthy: false}
- name: OnDelete needs ready only
  rev: 1
  now: "2026-01-01T00:05:00Z"
  since: "2026-01-01T00:00:00Z"
  plan: [{kind: StatefulSet, metadata: {name: db}}]
  cached:
  - {kind: StatefulSet, metadata: {name: db, generation: 2, labels: {control-8/revision: "1"}}, spec: {replicas: 2, updateStrategy: {type: OnDelete}}, status: {observedGeneration: 2, readyReplicas: 2, updatedReplicas: 0, currentRevision: db-a, updateRevision: db-b}}
  want: {healthy: true}
- name: not all ready
  rev: 1
  now: "2026-01-01T00:05:00Z"
  since: "2026-01-01T00:00:00Z"
  plan: [{kind: StatefulSet, metadata: {name: db}}]
  cached:
  - {kind: StatefulSet, metadata: {name: db, generation: 2, labels: {control-8/revision: "1"}}, spec: {replicas: 3}, status: {observedGeneration: 2, readyReplicas: 2, updatedReplicas: 3, currentRevision: db-b, updateRevision: db-b}}
  want: {healthy: false, ready: 2, desired: 3}
- name: crashloop pod owned directly
  rev: 1
  now: "2026-01-01T00:05:00Z"
  since: "2026-01-01T00:00:00Z"
  plan: [{kind: StatefulSet, metadata: {name: db}}]
  cached:
  - {kind: StatefulSet, metadata: {name: db, generation: 2, labels: {control-8/revision: "1"}}, spec: {replicas: 1}, status: {observedGeneration: 2, readyReplicas: 0, updatedReplicas: 1}}
  - {kind: Pod, metadata: {name: db-0, creationTimestamp: "2026-01-01T00:00:05Z", ownerReferences: [{kind: StatefulSet, name: db}]}, status: {containerStatuses: [{state: {waiting: {reason: CrashLoopBackOff}}}]}}
  want: {healthy: false, failed: true, reason: db-0}
