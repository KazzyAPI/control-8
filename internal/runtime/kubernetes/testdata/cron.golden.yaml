apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/managed-by: control-8
    control-8/managed: "true"
    control-8/namespace: shop
    control-8/revision: "3"
    control-8/safety-profile: managed_rollout
    control-8/stack: stk_test
  name: nightly
  namespace: shop
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: control-8
            control-8/managed: "true"
            control-8/namespace: shop
            control-8/safety-profile: managed_rollout
            control-8/stack: stk_test
        spec:
          containers:
          - image: busybox:1.36
            name: job
          restartPolicy: Never
  schedule: 0 3 * * *
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/managed-by: control-8
    control-8/managed: "true"
    control-8/namespace: shop
    control-8/revision: "3"
    control-8/safety-profile: managed_rollout
    control-8/stack: stk_test
  name: db
  namespace: shop
spec:
  selector:
    matchLabels:
      app: db
  serviceName: db
  template:
    metadata:
      labels:
        app: db
        app.kubernetes.io/managed-by: control-8
        control-8/managed: "true"
        control-8/namespace: shop
        control-8/safety-profile: managed_rollout
        control-8/stack: stk_test
    spec:
      containers:
      - image: postgres:16
        name: pg
